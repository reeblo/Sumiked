<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUMIKED - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="static/css/custom.css" />
    <style>
      :root {
        --primary: #ff5d1c;
        --primary-dark: #d84b13;
        --secondary: #2a4365;
        --radius: 18px;
      }

      body {
        background: linear-gradient(135deg, #ff5d1c 0%, #2a4365 100%);
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* --- Tarjeta principal --- */
      .login-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: var(--radius);
        padding: 35px 32px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08),
          0 20px 40px rgba(0, 0, 0, 0.12);
        animation: fadeIn 0.6s ease-in-out;
      }

      /* Logo */
      .login-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 25px;
      }
      .login-logo img {
        height: 55px;
        margin-bottom: 10px;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.1));
      }

      /* --- Inputs --- */
      .form-control {
        border-radius: 12px;
        border: 2px solid #e6e6e6;
        padding: 11px 14px;
        transition: 0.3s ease;
        font-size: 0.92rem;
      }

      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.15rem rgba(255, 93, 28, 0.28);
      }

      /* Etiquetas */
      .form-label {
        font-size: 0.82rem;
        font-weight: 600;
        color: #333;
      }

      /* --- Botón --- */
      .btn-login {
        background: var(--primary);
        color: #fff;
        padding: 11px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        width: 100%;
        transition: 0.3s ease;
        font-size: 0.95rem;
        letter-spacing: 0.3px;
      }

      .btn-login:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(255, 93, 28, 0.35);
      }

      /* --- Alerta superior --- */
      .alert-container {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2000;
        width: 92%;
        max-width: 470px;
      }

      /* Footer */
      .login-footer {
        text-align: center;
        margin-top: 15px;
      }
      .login-footer a {
        font-size: 0.82rem;
        color: #6c757d;
        text-decoration: none;
      }
      .login-footer a:hover {
        color: var(--primary);
      }

      /* Animación */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- Alerta fija en la parte superior -->
    <div class="alert-container">
      <div
        class="alert alert-warning alert-dismissible fade show shadow"
        role="alert"
      >
        <i class="fas fa-shield-alt me-2"></i>
        <strong>Acceso Restringido</strong> - Esta área es exclusiva para
        administradores autorizados de SUMIKED.
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
    </div>

    <div
      class="container d-flex align-items-center justify-content-center"
      style="min-height: 80vh"
    >
      <div
        class="card shadow-sm"
        style="max-width: 420px; width: 100%; border-radius: 12px"
      >
        <div class="card-body p-4">
          <div class="text-center mb-3">
            <img
              src="{{ url_for('static', filename='img/logo.jpeg') }}"
              alt="SUMIKED"
              style="height: 48px"
            />
            <h5 class="mt-2">Acceso a SUMIKED</h5>
          </div>

          {% with messages = get_flashed_messages(with_categories=true) %} {% if
          messages %} {% for category, message in messages %}
          <div
            class="alert alert-{{ 'danger' if category=='error' else category }} small py-2"
            role="alert"
          >
            {{ message }}
          </div>
          {% endfor %} {% endif %} {% endwith %}

          <form method="post" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
              <label class="form-label small">Usuario</label>
              <input
                name="username"
                class="form-control"
                type="text"
                required
                autofocus
              />
            </div>
            <div class="mb-3">
              <label class="form-label small">Contraseña</label>
              <input
                name="password"
                class="form-control"
                type="password"
                required
              />
            </div>
            <button class="btn btn-primary w-100" type="submit">
              Ingresar
            </button>
          </form>
        </div>
        <div class="card-footer text-center small py-2">
          <a href="{{ url_for('public.index') }}" class="text-muted"
            >Volver al sitio</a
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
